<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitbull Hotshots | Nationwide Heavy Haul & Flatbed Transportation</title>
    <style>
        /* --- DESIGN SYSTEM & TOKENS --- */
        :root {
            --bg-main: #121212;       /* Slate Dark Metal */
            --bg-card: #1a1a1a;       /* Lighter Contrast Gray */
            --bg-input: #262626;      /* Clean Input Background */
            --primary: #da1212;       /* Crimson Red Accent */
            --primary-hover: #aa0e0e; /* Dark Crimson */
            --text-main: #ffffff;
            --text-muted: #cccccc;
            --border-metal: #333333;
            --accent-chrome: #f0f0f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        /* --- UTILITIES --- */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: var(--text-main);
            padding: 12px 28px;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--accent-chrome);
            color: var(--accent-chrome);
        }

        .btn-outline:hover {
            background-color: var(--accent-chrome);
            color: var(--bg-main);
        }

        .section-title {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-align: center;
        }

        .section-title span {
            color: var(--primary);
        }

        .section-subtitle {
            color: var(--text-muted);
            text-align: center;
            max-width: 600px;
            margin: 0 auto 50px auto;
            font-size: 1.1rem;
        }

        /* --- NAVIGATION --- */
        header {
            background-color: #1a1a1a;
            border-bottom: 2px solid var(--primary);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        nav a {
            color: var(--accent-chrome);
            text-decoration: none;
            margin-left: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--primary);
        }

        /* --- HERO SECTION --- */
        #hero {
            padding-top: 180px;
            padding-bottom: 100px;
            background-color: #151515;
            border-bottom: 1px solid var(--border-metal);
            text-align: center;
        }

        .badge {
            background-color: rgba(218, 18, 18, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 20px;
        }

        #hero h1 {
            font-size: 4rem;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        #hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto 40px auto;
        }

        .hero-cta {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* --- SPECS & CAPABILITIES --- */
        #specs {
            padding: 100px 0;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-metal);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .spec-card {
            background-color: var(--bg-main);
            border: 1px solid var(--border-metal);
            padding: 40px 30px;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        .spec-card:hover {
            border-color: var(--primary);
        }

        .spec-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--primary);
        }

        .spec-card h3 {
            font-size: 1.3rem;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .spec-card ul {
            list-style: none;
        }

        .spec-card li {
            color: var(--text-muted);
            margin-bottom: 10px;
            padding-left: 20px;
            position: relative;
        }

        .spec-card li::before {
            content: '⚡';
            position: absolute;
            left: 0;
            color: var(--primary);
        }

        /* --- COMPLIANCE STRIP --- */
        .compliance-bar {
            background-color: #0b0b0b;
            border-bottom: 1px solid var(--border-metal);
            padding: 25px 0;
        }

        .compliance-flex {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            text-align: center;
        }

        .compliance-item p {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .compliance-item strong {
            color: var(--text-main);
            display: block;
            font-size: 1.1rem;
            margin-top: 2px;
        }

        /* --- QUOTE FORM SECTION --- */
        #quote {
            padding: 100px 0;
            background-color: var(--bg-main);
        }

        .quote-wrapper {
            background-color: var(--bg-card);
            border: 1px solid var(--border-metal);
            border-radius: 6px;
            padding: 50px;
            max-width: 800px;
            margin: 0 auto;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(48%, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group-full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            color: var(--accent-chrome);
        }

        input, textarea, select {
            background-color: var(--bg-input);
            border: 1px solid var(--border-metal);
            color: var(--text-main);
            padding: 14px;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* --- TEXT AI BOT INTERACTIVE WIDGET --- */
        #ai-widget {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 360px;
            max-height: 500px;
            background-color: var(--bg-card);
            border: 2px solid var(--primary);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            z-index: 2000;
            overflow: hidden;
        }

        .ai-header {
            background-color: var(--primary);
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .ai-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            height: 300px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #111111;
        }

        .chat-msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 6px;
font-size: 0.9rem;
}
.chat-msg.bot {
background-color: var(--bg-input);
color: var(--text-main);
align-self: flex-start;
border-left: 3px solid var(--primary);
}
.chat-msg.user {
background-color: var(--primary);
color: white;
align-self: flex-end;
}
.ai-footer {
padding: 10px;
background-color: var(--bg-card);
border-top: 1px solid var(--border-metal);
display: flex;
gap: 8px;
}
.ai-footer input {
flex: 1;
padding: 10px;
font-size: 0.85rem;
border-radius: 4px;
}
.ai-footer button {
background-color: var(--primary);
color: white;
border: none;
padding: 0 15px;
font-weight: bold;
border-radius: 4px;
cursor: pointer;
text-transform: uppercase;
font-size: 0.75rem;
}
/* --- FOOTER --- */
footer {
background-color: #0a0a0a;
border-top: 1px solid var(--border-metal);
padding: 60px 0 30px 0;
}
.footer-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
gap: 40px;
margin-bottom: 40px;
}
.footer-about h4, .footer-contact h4 {
text-transform: uppercase;
font-size: 1.1rem;
margin-bottom: 20px;
letter-spacing: 0.5px;
}
.footer-about p {
color: var(--text-muted);
font-size: 0.95rem;
}
.footer-contact p {
color: var(--text-muted);
margin-bottom: 12px;
font-size: 0.95rem;
}
.footer-contact a {
color: var(--text-main);
text-decoration: none;
transition: color 0.3s ease;
}
.footer-contact a:hover {
color: var(--primary);
}
.footer-bottom {
border-top: 1px solid var(--border-metal);
padding-top: 30px;
text-align: center;
font-size: 0.85rem;
color: var(--text-muted);
}
/* --- RESPONSIVE ADJUSTMENTS --- */
@media (max-width: 768px) {
#hero h1 { font-size: 2.5rem; }
.hero-cta { flex-direction: column; gap: 15px; }
nav { display: none; }
.quote-wrapper { padding: 30px 20px; }
#ai-widget { width: 310px; right: 10px; bottom: 10px; }
}

function handleKeyPress(e) {

processUserMessage();

function processUserMessage() {
const inputField = document.getElementById('userInput');
const chatBody = document.getElementById('chatBody');
const query = inputField.value.trim();
if (query === '') return;
// Display User Message
const userDiv = document.createElement('div');
userDiv.className = 'chat-msg user';
userDiv.textContent = query;
chatBody.appendChild(userDiv);
inputField.value = '';
// Auto-scroll chat body
chatBody.scrollTop = chatBody.scrollHeight;
// Process AI Logics based on hotshot freight business requirements
setTimeout(() => {
const botDiv = document.createElement('div');
botDiv.className = 'chat-msg bot';
const lowerQuery = query.toLowerCase();
if (lowerQuery.includes('appointment') || lowerQuery.includes('speak') || lowerQuery.includes('call') || lowerQuery.includes('talk') || lowerQuery.includes('schedule')) {
botDiv.innerHTML = "I would be happy to set up a direct call with dispatch! Please fill out our brief Get A Quote form on this page with your phone details, or tap the button at the top to dial us immediately at (707) 506-6353.";
} else if (lowerQuery.includes('insurance') || lowerQuery.includes('cover')) {
botDiv.textContent = "We carry an active $250,000 cargo insurance limit to protect structural assets and general freight movements over long distances safely.";
} else if (lowerQuery.includes('trailer') || lowerQuery.includes('gator') || lowerQuery.includes('length') || lowerQuery.includes('size')) {
botDiv.textContent = "We run a brand new 2026 Gatormade Gooseneck Flatbed featuring a 20-25ft main deck plus a 5ft dovetail with fold-flat mega decks and dual 8K/10K axles.";
} else if (lowerQuery.includes('truck') || lowerQuery.includes('rig') || lowerQuery.includes('f350')) {
botDiv.textContent = "Our main tractor asset is a high-output Ford F350 turbo-diesel dually, maintained meticulously to achieve rapid cross-country delivery.";
} else if (lowerQuery.includes('where') || lowerQuery.includes('location') || lowerQuery.includes('charlotte')) {
botDiv.textContent = "Our home operations base is in Charlotte, North Carolina, but our operational lanes service all lower 48 states nationwide.";
} else if (lowerQuery.includes('price') || lowerQuery.includes('rate') || lowerQuery.includes('cost') || lowerQuery.includes('mile')) {
botDiv.textContent = "Our per-mile lane rates depend entirely on the specific dimensions, cargo weight, and destination routes. Please submit your lanes in our 'Get a Quote' block for rapid pricing reviews.";
} else {
botDiv.innerHTML = "Got it! For detailed freight scheduling, lane availability queries, or to confirm a formal phone appointment, please drop your info directly into our main routing form on this page or call dispatch at (707) 506-6353.";
}
chatBody.appendChild(botDiv);
chatBody.scrollTop = chatBody.scrollHeight;
}, 600);
}
